version: 2

models:
  - name: int_team_match_results
    description: >
      One row per team per finished match. Unpivots home/away into a single
      perspective per team, adding points (3/1/0), result (W/D/L), and is_home flag.
    columns:
      - name: match_id
        description: "Match identifier."
        tests:
          - not_null
      - name: match_date
        description: "Date the match was played."
        tests:
          - not_null
      - name: matchday
        description: "Season matchday for this fixture."
        tests:
          - not_null
      - name: season_start_date
        description: "Season identifier anchored to the season start date."
        tests:
          - not_null
      - name: team_id
        description: "Team this row belongs to."
        tests:
          - not_null
          - relationships:
              to: ref('stg_teams')
              field: team_id
      - name: opponent_id
        description: "Opposing team identifier."
        tests:
          - not_null
      - name: is_home
        description: "1 if the team played at home, 0 if away."
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      - name: goals_scored
        description: "Goals scored by this team in the match."
        tests:
          - not_null
      - name: goals_conceded
        description: "Goals conceded by this team in the match."
        tests:
          - not_null
      - name: points
        description: "Points earned: 3 (win), 1 (draw), 0 (loss)."
        tests:
          - not_null
          - accepted_values:
              values: [0, 1, 3]
      - name: result
        description: "Match result from this team's perspective: W, D, or L."
        tests:
          - not_null
          - accepted_values:
              values: ["W", "D", "L"]

  - name: int_form_last_5
    description: >
      Rolling form over the 5 matches before each match per team.
      Intended for use as ML features — uses PRECEDING rows only to avoid leakage.
    columns:
      - name: team_id
        description: "Team identifier."
        tests:
          - not_null
      - name: match_id
        description: "Match identifier this form row corresponds to."
        tests:
          - not_null
      - name: form_points_last_5
        description: "Sum of points in the 5 matches before this one. NULL for first match."
      - name: form_wins_last_5
        description: "Wins in the 5 matches before this one."
      - name: form_draws_last_5
        description: "Draws in the 5 matches before this one."
      - name: form_losses_last_5
        description: "Losses in the 5 matches before this one."
      - name: form_matches_available
        description: "Number of prior matches available (up to 5). Useful for early-season rows."
        tests:
          - not_null

  - name: int_h2h
    description: >
      Exact-fixture head-to-head metrics computed before each match starts.
    columns:
      - name: match_id
        tests:
          - not_null
      - name: home_team_id
        tests:
          - not_null
      - name: away_team_id
        tests:
          - not_null
      - name: h2h_home_win_rate
        tests:
          - not_null

  - name: int_advanced_form_last_5
    description: >
      Rolling advanced stats from the 5 previous matches for each team.
    columns:
      - name: team_id
        tests:
          - not_null
      - name: match_id
        tests:
          - not_null
      - name: xg_for_avg_last_5
      - name: xg_against_avg_last_5

  - name: int_standings_snapshot
    description: >
      Standings snapshot shifted by matchday. Rows with snapshot_matchday N
      represent league positions before matchday N starts.
    columns:
      - name: season_start_date
        description: "Season identifier anchored to the season start date."
        tests:
          - not_null
      - name: snapshot_matchday
        description: "Matchday this snapshot should be used for."
        tests:
          - not_null
      - name: team_id
        description: "Team identifier."
        tests:
          - not_null
          - relationships:
              to: ref('stg_teams')
              field: team_id
      - name: position
        description: "Position before the given matchday starts. NULL on matchday 1."
      - name: points
        description: "Points accumulated before the given matchday."
        tests:
          - not_null
