name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.3
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --spider -q http://localhost:8123/ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CLICKHOUSE_HOST: localhost
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: football

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize ClickHouse schema
        run: |
          python - <<'PY'
          import clickhouse_connect
          from pathlib import Path

          client = clickhouse_connect.get_client(host="localhost", port=8123)
          sql = Path("infra/clickhouse/init.sql").read_text()
          for statement in [part.strip() for part in sql.split(";") if part.strip()]:
              client.command(statement)
          PY

      - name: dbt compile
        run: dbt compile --project-dir dbt --profiles-dir dbt

      - name: dbt run
        run: dbt run --project-dir dbt --profiles-dir dbt

      - name: dbt test
        run: dbt test --project-dir dbt --profiles-dir dbt

      - name: pytest
        run: pytest tests/test_api_schemas.py
