services:

  # ─── Airflow metadata DB ────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Airflow init (runs once, exits) ────────────────────────────────────────
  airflow-init:
    image: apache/airflow:2.9.0
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      _PIP_ADDITIONAL_REQUIREMENTS: "pandas pyarrow boto3 clickhouse-connect"
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create
          --username admin
          --firstname Admin
          --lastname Admin
          --role Admin
          --email admin@football-analytics.local
          --password $${AIRFLOW_ADMIN_PASSWORD}
      "
    restart: on-failure

  # ─── Airflow webserver (UI on :8080) ────────────────────────────────────────
  airflow-webserver:
    image: apache/airflow:2.9.0
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      _PIP_ADDITIONAL_REQUIREMENTS: "pandas pyarrow boto3 clickhouse-connect"
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ─── Airflow scheduler ──────────────────────────────────────────────────────
  airflow-scheduler:
    image: apache/airflow:2.9.0
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      _PIP_ADDITIONAL_REQUIREMENTS: "pandas pyarrow boto3 clickhouse-connect"
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - airflow_logs:/opt/airflow/logs
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ─── MinIO (object storage: raw/ and refined/) ──────────────────────────────
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"   # S3-compatible API
      - "9001:9001"   # Web console
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ─── MinIO init (creates raw/ and refined/ buckets, exits) ──────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/raw &&
        mc mb --ignore-existing local/refined &&
        echo 'Buckets ready: raw/, refined/'
      "
    restart: on-failure

  # ─── ClickHouse (OLAP, host:8124→container:8123) ────────────────────────────
  # Port 8124 (not 8123) avoids conflicts if another ClickHouse is already
  # running on the host (e.g. another project).  dbt profiles.yml uses 8124.
  # DAGs running inside Docker still reach it via clickhouse:8123 (service name).
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports:
      - "8124:8123"   # HTTP interface (used by dbt + FastAPI from host)
      - "9010:9000"   # Native TCP (optional; 9009 may be taken by another project)
    env_file: .env
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ─── MLflow tracking server (:5001 on host) ─────────────────────────────────
  # Port 5001 (not 5000) avoids conflict with macOS AirPlay Receiver which
  # occupies :5000 by default. Container internally still uses 5000.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.0
    ports:
      - "5001:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:////mlflow/mlflow.db
        --artifacts-destination /mlflow/artifacts
        --default-artifact-root mlflow-artifacts:/
        --serve-artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ─── db-init: bootstrap ClickHouse raw tables + run dbt ────────────────────
  # Runs once (exits 0 on success).  trainer depends on it completing first.
  db-init:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    env_file: .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
    command: >
      bash -c "
        echo '=== Bootstrapping ClickHouse raw tables ===' &&
        python scripts/bootstrap_clickhouse.py --host clickhouse --port 8123 &&
        echo '=== Running dbt ===' &&
        cd /app/dbt &&
        dbt run --profiles-dir /app/dbt --project-dir /app/dbt &&
        dbt test --profiles-dir /app/dbt --project-dir /app/dbt &&
        echo '=== DB init complete ==='
      "
    restart: on-failure

  # ─── trainer: train Poisson model → MLflow registry ─────────────────────────
  trainer:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    command: >
      python ml/scripts/train_poisson.py
        --ch-host clickhouse
        --ch-port 8123
        --mlflow-uri http://mlflow:5000
    restart: on-failure

  # ─── api: FastAPI on :8001 (host) ────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      trainer:
        condition: service_completed_successfully
    ports:
      - "8001:8000"
    env_file: .env
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ─── frontend: Next.js on :3001 (host) ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3001:3001"
    restart: unless-stopped

volumes:
  postgres_data:
  airflow_logs:
  minio_data:
  clickhouse_data:
  mlflow_data:
